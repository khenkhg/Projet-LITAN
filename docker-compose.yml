services:
  db:
    image: postgres:16-alpine
    container_name: litan_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litan}
      POSTGRES_USER: ${POSTGRES_USER:-litan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litan_secure_password_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litan_user} -d ${POSTGRES_DB:-litan}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: litan_backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: litan_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
  backend_static:
